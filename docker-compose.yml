# Development stack for the backend alone: PostgreSQL plus the API.
#
# The client is a separate repository (d2-project-client) and is not started
# here. To run the whole system from published images, use the compose file in
# the sibling docker-compose/ directory instead.
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_password}
      POSTGRES_DB: ${POSTGRES_DB:-spa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spa_user} -d ${POSTGRES_DB:-spa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spa_user}:${POSTGRES_PASSWORD:-spa_password}@db/${POSTGRES_DB:-spa_db}
      API_TOKEN: ${API_TOKEN:-sse-staff-token}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
