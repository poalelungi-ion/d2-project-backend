services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_password}
      POSTGRES_DB: ${POSTGRES_DB:-spa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spa_user} -d ${POSTGRES_DB:-spa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spa_user}:${POSTGRES_PASSWORD:-spa_password}@db/${POSTGRES_DB:-spa_db}
      # Signs access and refresh tokens; set a real one outside development.
      JWT_SECRET: ${JWT_SECRET:-insecure-development-secret-change-me}
      # Explicit origin: the refresh cookie makes auth requests credentialed,
      # and browsers reject a wildcard origin on those.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
