# CI-only complexity budgets. Kept separate from any day-to-day ruff config so
# local runs stay focused on correctness.
#
# Backstop values, not style preferences. Today's worst function is
# src/services/ingestion.py::preview_upload (complexity 22, 22 branches,
# 63 statements, 9 arguments), so these catch runaway growth rather than
# flagging existing code.
line-length = 120

[lint]
# C901 = cyclomatic complexity, PLR0912/0913/0915 = branches/arguments/statements.
# The default E/F rules ride along as non-blocking findings, mirroring the way
# the frontend job reports type-safety errors without failing on them.
select = ["E4", "E7", "E9", "F", "C901", "PLR0912", "PLR0913", "PLR0915"]

[lint.mccabe]
max-complexity = 25

[lint.pylint]
max-branches = 25
max-args = 10
max-statements = 70
