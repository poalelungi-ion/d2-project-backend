stages: [quality, publish]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.quality_rules: &quality_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.python_base: &python_base
  stage: quality
  image: python:3.11-slim
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip]
  rules: *quality_rules

duplication:
  stage: quality
  # Node image: jscpd is the same duplication scanner the client pipeline uses,
  # and it needs no Python dependencies to read the sources.
  image: node:22-alpine
  rules: *quality_rules
  script:
    - npx jscpd@5 . --reporters console,html,codeclimate,json
  artifacts:
    when: always
    paths: [report/]
    reports:
      codequality: report/gl-code-quality-report.json

complexity:
  <<: *python_base
  script:
    - pip install ruff
    # Prints every finding to the job log and writes the code quality report.
    # `|| true` so non-complexity lint errors don't abort the job here; the
    # summary below decides the exit code.
    - ruff check --config ruff.ci.toml --output-format concise src || true
    - ruff check --config ruff.ci.toml --output-format gitlab src > gl-code-quality-report.json || true
    # Console summary, and the gate: fails the job on complexity violations only.
    - python scripts/complexity_summary.py gl-code-quality-report.json
  artifacts:
    when: always
    paths: [gl-code-quality-report.json]
    reports:
      codequality: gl-code-quality-report.json

unit_tests:
  <<: *python_base
  variables:
    # Floor, not a target. Raise it as tests land so coverage can only ratchet up.
    COVERAGE_FLOOR: "65"
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    # `python -m pytest` so the repo root lands on sys.path and `import src`
    # resolves. `|| true` keeps failing tests from skipping the summary below,
    # which decides the exit code.
    - python -m pytest --junitxml=junit.xml --cov=src --cov-branch
        --cov-report=term --cov-report=xml:coverage.xml --cov-report=json:coverage.json || true
    - python scripts/test_summary.py junit.xml coverage.json
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [junit.xml, coverage.xml, coverage.json]
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

require_approval:
  stage: quality
  image: alpine:3.20
  # Merge request pipelines only: there is nothing to approve on a branch build.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    REQUIRED_APPROVALS: "1"
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh scripts/require_approval.sh

# Publishes the API as a container image so other pipelines can run against a
# real backend without rebuilding it. 
publish_image:
  stage: publish
  image: docker:27
  services: [docker:27-dind]
  # Default branch only: feature branches and merge requests have no consumer
  # yet, and a tag per branch would fill the registry with images nothing pulls.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Talk to the dind service over TLS. GitLab shares the generated
    # certificates between the service and this job through DOCKER_TLS_CERTDIR.
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    # BuildKit, for the inline cache the --cache-from below reads.
    DOCKER_BUILDKIT: "1"
  before_script:
    # CI_REGISTRY_USER / _PASSWORD are injected by GitLab and scoped to this
    # project's registry for the length of the job; nothing needs configuring.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # Warm the layer cache from the last published image. Fails harmlessly on
    # the very first run, when there is no :main to pull yet.
    - docker pull "$CI_REGISTRY_IMAGE:main" || true
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE:main"
        --build-arg BUILDKIT_INLINE_CACHE=1
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        --tag "$CI_REGISTRY_IMAGE:main"
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:main"
    - echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA and :main"
