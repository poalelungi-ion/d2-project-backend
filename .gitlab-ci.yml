stages: [quality, publish]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.quality_rules: &quality_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.python_base: &python_base
  stage: quality
  image: python:3.11-slim
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip]
  rules: *quality_rules

duplication:
  stage: quality
  # Node image: jscpd is the same duplication scanner the client pipeline uses,
  # and it needs no Python dependencies to read the sources.
  image: node:22-alpine
  rules: *quality_rules
  script:
    - npx jscpd@5 . --reporters console,html,codeclimate,json
  artifacts:
    when: always
    paths: [report/]
    reports:
      codequality: report/gl-code-quality-report.json

complexity:
  <<: *python_base
  script:
    - pip install ruff
    # Prints every finding to the job log and writes the code quality report.
    # `|| true` so non-complexity lint errors don't abort the job here; the
    # summary below decides the exit code.
    - ruff check --config ruff.ci.toml --output-format concise src || true
    - ruff check --config ruff.ci.toml --output-format gitlab src > gl-code-quality-report.json || true
    # Console summary, and the gate: fails the job on complexity violations only.
    - python scripts/complexity_summary.py gl-code-quality-report.json
  artifacts:
    when: always
    paths: [gl-code-quality-report.json]
    reports:
      codequality: gl-code-quality-report.json

unit_tests:
  <<: *python_base
  variables:
    # Floor, not a target. Raise it as tests land so coverage can only ratchet up.
    COVERAGE_FLOOR: "65"
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    # `python -m pytest` so the repo root lands on sys.path and `import src`
    # resolves. `|| true` keeps failing tests from skipping the summary below,
    # which decides the exit code.
    - python -m pytest --junitxml=junit.xml --cov=src --cov-branch
        --cov-report=term --cov-report=xml:coverage.xml --cov-report=json:coverage.json || true
    - python scripts/test_summary.py junit.xml coverage.json
  coverage: '/Total coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [junit.xml, coverage.xml, coverage.json]
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

require_approval:
  stage: quality
  image: alpine:3.20
  # Merge request pipelines only: there is nothing to approve on a branch build.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    REQUIRED_APPROVALS: "1"
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh scripts/require_approval.sh

# Publishes the API as a container image so other pipelines can run against a
# real backend without rebuilding it. Tagged by commit and by branch slug, so
# on main this publishes :main and on a branch :test-e2e -- a branch can be
# exercised without touching the tag the client pipeline pulls.
#
# Built with Kaniko rather than docker-in-docker: dind needs a privileged
# runner and a reachable daemon container, and these runners provide neither
# ("no route to host" on the dind service). Kaniko builds from the Dockerfile
# in this job's own container, so there is no daemon and no service to reach.
publish_image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    # The image's own entrypoint is the executor; clear it so GitLab can run
    # the script below in a shell.
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    # Kaniko reads registry credentials from this file rather than `docker
    # login`. CI_REGISTRY_USER / _PASSWORD are injected by GitLab and scoped to
    # this project's registry for the length of the job.
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
  script:
    # --cache pushes intermediate layers to a side repository, so the pip
    # install in the Dockerfile is reused until requirements.txt changes.
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
        --cache=true
        --cache-repo "$CI_REGISTRY_IMAGE/cache"
    - echo "Published $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA and :$CI_COMMIT_REF_SLUG"
